<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --accent: #00462A;
  --accent-pale: #E8EFEB;
  --bg-page: #FFFDF1;
  --bg-card: #FFFFFF;
  --neutral: #B9B9B9;
  --border: #E1E4E8;
  --text-primary: #1A1A1A;
  --text-secondary: #5F6368;
  --series-2: #8C8C8C;   /* 두 번째 계열(이익) — 흰 바탕 대비 3:1 이상 */
  --grid: #EEF0F2;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg-page);
  color: var(--text-primary);
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 48px; }
header h1 { margin: 0 0 4px; font-size: 26px; font-weight: 700; color: var(--accent); }
header p { margin: 0; color: var(--text-secondary); font-size: 13px; }

h2 {
  border-left: 4px solid var(--accent);
  padding-left: 12px;
  color: var(--accent);
  font-size: 17px;
  font-weight: 700;
  margin: 0 0 4px;
}
.sub { margin: 0 0 14px 16px; color: var(--text-secondary); font-size: 13px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 24px 0 16px; }
.filters .label { font-size: 13px; color: var(--text-secondary); margin-right: 4px; }
.chip {
  font: inherit; font-size: 14px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-card);
  color: var(--text-primary);
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.chip:focus-visible, .hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.callout {
  background: var(--accent-pale);
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  border-radius: 4px;
  margin-bottom: 20px;
}
.key-number { color: var(--accent); font-weight: 700; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px 18px;
  box-shadow: 0 1px 2px rgba(0,0,0,.03);
  min-width: 0;
}
.kpi .k-label { font-size: 13px; color: var(--text-secondary); }
.kpi .k-value { font-size: 26px; font-weight: 700; color: var(--accent); margin: 2px 0; white-space: nowrap; }
.kpi .k-note { font-size: 12px; color: var(--text-secondary); }

.section { margin-bottom: 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid2 .section { margin-bottom: 0; }

.legend { display: flex; gap: 18px; margin: 0 0 8px 16px; font-size: 13px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }

.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: inherit; }
.tip {
  position: absolute; pointer-events: none; z-index: 5;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 8px 12px; font-size: 13px; line-height: 1.6; min-width: 180px;
  display: none;
}
.tip b { display: block; color: var(--text-primary); margin-bottom: 2px; }
.tip .row { display: flex; justify-content: space-between; gap: 16px; }
.tip .row span:first-child { color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
.tip .row span:last-child { font-variant-numeric: tabular-nums; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
th {
  background: var(--accent-pale); color: var(--accent);
  font-weight: 700; text-align: right; padding: 9px 12px; white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
tr.total td { font-weight: 700; color: var(--accent); }

footer { margin-top: 28px; font-size: 12px; color: var(--text-secondary); }

@media (max-width: 900px) {
  .grid2 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 420px) {
  .kpi .k-value { font-size: 21px; }
  header h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>__HEADING__</h1>
    <p>__SOURCE_LINE__</p>
  </header>

  <div class="filters" role="group" aria-label="부서 선택">
    <span class="label">부서</span>
    <div id="chips" style="display:contents"></div>
  </div>

  <div class="callout" id="callout"></div>

  <div class="kpis" id="kpis"></div>

  <div class="card section">
    <h2>월별 매출액과 이익</h2>
    <p class="sub">막대에 마우스를 올리면 그 달의 비용·이익률까지 보여요.</p>
    <div class="legend">
      <span><i class="sw" style="background:var(--accent)"></i>매출액</span>
      <span><i class="sw" style="background:var(--series-2)"></i>이익</span>
    </div>
    <div class="chart" id="monthChart"></div>
  </div>

  <div class="grid2">
    <div class="card section">
      <h2 id="secondTitle">부서별 매출액</h2>
      <p class="sub" id="secondSub"></p>
      <div class="chart" id="secondChart"></div>
    </div>
    <div class="card section">
      <h2>거래처별 매출액 TOP 10</h2>
      <p class="sub" id="clientSub"></p>
      <div class="chart" id="clientChart"></div>
    </div>
  </div>

  <div class="card section">
    <h2>월별 요약 표</h2>
    <p class="sub" id="tableSub">차트의 숫자를 원 단위로 보여줘요.</p>
    <div class="table-wrap"><table id="monthTable"></table></div>
  </div>

  <footer>
    이 대시보드는 엑셀 통합 파일의 데이터를 그대로 담고 있어요. 인터넷 연결 없이 열려요.
    엑셀 파일이 바뀌면 대시보드를 다시 만들어야 반영돼요. (만든 날: __MADE__)
  </footer>
</div>

<script>
const RAW = __DATA__;
const PERIOD = __PERIOD_JSON__;
const rows = RAW.map(r => ({ ym: r[0], dept: r[1], item: r[2], client: r[3], mgr: r[4], rev: r[5], cost: r[6], profit: r[7] }));
const DEPTS = [...new Set(rows.map(r => r.dept))];
const MONTHS = [...new Set(rows.map(r => r.ym))].sort();
const state = { dept: "전체" };

const won = v => Math.round(v).toLocaleString("ko-KR") + "원";
const eok = v => (v / 1e8).toFixed(1) + "억 원";
const eokShort = v => (v / 1e8).toFixed(1) + "억";
const pct = v => (v * 100).toFixed(1) + "%";
// 여러 해에 걸치면 축에 연도를 짧게 붙인다 (예: 26.12월)
const MULTI_YEAR = new Set(MONTHS.map(m => m.slice(0, 4))).size > 1;
const monthLabel = ym => (MULTI_YEAR ? ym.slice(2, 4) + "." : "") + Number(ym.slice(5)) + "월";
const monthFull = ym => `${ym.slice(0, 4)}년 ${Number(ym.slice(5))}월`;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function agg(list, key) {
  const m = new Map();
  for (const r of list) {
    const k = r[key];
    const a = m.get(k) || { key: k, n: 0, rev: 0, cost: 0, profit: 0 };
    a.n++; a.rev += r.rev; a.cost += r.cost; a.profit += r.profit;
    m.set(k, a);
  }
  return [...m.values()];
}
function total(list) {
  return list.reduce((a, r) => { a.n++; a.rev += r.rev; a.cost += r.cost; a.profit += r.profit; return a; },
    { n: 0, rev: 0, cost: 0, profit: 0 });
}
function filtered() { return state.dept === "전체" ? rows : rows.filter(r => r.dept === state.dept); }

const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function h(tag, attrs, text) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function niceTop(max) {
  const raw = max / 4;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw);
  return { step, top: Math.ceil(max / step) * step };
}
// 아래쪽(기준선)은 각지고 위쪽 끝만 둥근 막대
function colPath(x, y, w, base, r) {
  const hgt = base - y; r = Math.max(0, Math.min(r, w / 2, hgt));
  return `M${x},${base}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${base}Z`;
}
function barPath(x0, y, len, hgt, r) {
  r = Math.max(0, Math.min(r, hgt / 2, len));
  const x1 = x0 + len;
  return `M${x0},${y}H${x1 - r}Q${x1},${y} ${x1},${y + r}V${y + hgt - r}Q${x1},${y + hgt} ${x1 - r},${y + hgt}H${x0}Z`;
}

// ---------- 툴팁 ----------
function makeTip(box) {
  const tip = h("div", { class: "tip", role: "status" });
  box.appendChild(tip);
  return {
    show(evtOrEl, title, lines) {
      tip.replaceChildren(h("b", {}, title));
      for (const [label, value, color] of lines) {
        const row = h("div", { class: "row" });
        const l = h("span");
        if (color) { const sw = h("i", { class: "sw" }); sw.style.background = color; l.appendChild(sw); }
        l.appendChild(document.createTextNode(label));
        row.append(l, h("span", {}, value));
        tip.appendChild(row);
      }
      tip.style.display = "block";
      const br = box.getBoundingClientRect();
      let x, y;
      if (evtOrEl.clientX != null) { x = evtOrEl.clientX - br.left; y = evtOrEl.clientY - br.top; }
      else { const r = evtOrEl.getBoundingClientRect(); x = r.left - br.left + r.width / 2; y = r.top - br.top; }
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = x + 14; if (left + tw > box.clientWidth) left = x - tw - 14;
      left = Math.max(0, Math.min(left, box.clientWidth - tw));
      let top = y - th - 10; if (top < 0) top = y + 16;
      tip.style.left = left + "px"; tip.style.top = top + "px";
    },
    hide() { tip.style.display = "none"; }
  };
}

// ---------- 월별 묶은 세로 막대 ----------
function monthChart(box, data) {
  box.replaceChildren();
  const W = Math.max(box.clientWidth, 300), H = 300;
  const m = { t: 14, r: 8, b: 30, l: 50 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, base = m.t + ih;
  const { step, top } = niceTop(Math.max(...data.map(d => d.rev)));
  const y = v => base - (v / top) * ih;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "월별 매출액과 이익 막대 차트. 숫자는 아래 월별 요약 표에 있어요." });
  for (let v = 0; v <= top + 1; v += step) {
    svg.appendChild(s("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: v === 0 ? css("--neutral") : css("--grid"), "stroke-width": 1 }));
    svg.appendChild(s("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end", "font-size": 12, fill: css("--text-secondary") }, (v / 1e8).toFixed(step < 1e8 ? 1 : 0) + "억"));
  }
  const band = iw / data.length;
  const bw = Math.max(6, Math.min(26, band * 0.32));
  const groups = [];
  data.forEach((d, i) => {
    const cx = m.l + band * (i + 0.5);
    const g = s("g", {});
    g.appendChild(s("path", { d: colPath(cx - bw - 1, y(d.rev), bw, base, 4), fill: css("--accent") }));
    g.appendChild(s("path", { d: colPath(cx + 1, y(d.profit), bw, base, 4), fill: css("--series-2") }));
    svg.appendChild(g); groups.push(g);
    // 달이 많아 칸이 좁으면 월 이름을 하나 걸러 쓴다 (마지막 달은 항상 표시)
    const every = band < 34 ? 2 : 1;
    if (i % every === 0 || i === data.length - 1)
      svg.appendChild(s("text", { x: cx, y: base + 20, "text-anchor": "middle", "font-size": 12, fill: css("--text-secondary") }, monthLabel(d.key)));
  });
  const tip = makeTip(box);
  data.forEach((d, i) => {
    const hit = s("rect", { class: "hit", x: m.l + band * i, y: m.t, width: band, height: ih, fill: "transparent", tabindex: 0,
      "aria-label": `${monthLabel(d.key)} 매출액 ${won(d.rev)}, 이익 ${won(d.profit)}` });
    const on = e => {
      groups.forEach((g, j) => g.setAttribute("opacity", j === i ? 1 : 0.35));
      tip.show(e.clientX != null ? e : hit, monthFull(d.key), [
        ["매출액", won(d.rev), css("--accent")], ["비용", won(d.cost)], ["이익", won(d.profit), css("--series-2")],
        ["이익률", pct(d.profit / d.rev)], ["거래 건수", d.n + "건"]]);
    };
    const off = () => { groups.forEach(g => g.setAttribute("opacity", 1)); tip.hide(); };
    hit.addEventListener("mousemove", on); hit.addEventListener("focus", on);
    hit.addEventListener("mouseleave", off); hit.addEventListener("blur", off);
    svg.appendChild(hit);
  });
  box.prepend(svg);
}

// ---------- 가로 막대 (한 계열) ----------
function hbarChart(box, items, labelName) {
  box.replaceChildren();
  const W = Math.max(box.clientWidth, 280), rowH = 30, barH = 16;
  const labelW = Math.min(118, W * 0.34), valW = 52;
  const H = items.length * rowH + 4;
  const iw = W - labelW - valW - 8;
  const max = Math.max(...items.map(d => d.rev));
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${labelName}별 매출액 가로 막대 차트` });
  const tip = makeTip(box);
  const bars = [];
  items.forEach((d, i) => {
    const yy = i * rowH + 2;
    svg.appendChild(s("text", { x: labelW - 8, y: yy + rowH / 2 + 4, "text-anchor": "end", "font-size": 13, fill: css("--text-primary") }, d.key));
    const len = Math.max(2, (d.rev / max) * iw);
    const bar = s("path", { d: barPath(labelW, yy + (rowH - barH) / 2, len, barH, 4), fill: css("--accent") });
    svg.appendChild(bar); bars.push(bar);
    svg.appendChild(s("text", { x: labelW + len + 6, y: yy + rowH / 2 + 4, "font-size": 12, fill: css("--text-secondary") }, eokShort(d.rev)));
  });
  items.forEach((d, i) => {
    const hit = s("rect", { class: "hit", x: 0, y: i * rowH + 2, width: W, height: rowH, fill: "transparent", tabindex: 0,
      "aria-label": `${d.key} 매출액 ${won(d.rev)}` });
    const on = e => {
      bars.forEach((b, j) => b.setAttribute("opacity", j === i ? 1 : 0.35));
      tip.show(e.clientX != null ? e : hit, d.key, [
        ["매출액", won(d.rev), css("--accent")], ["이익", won(d.profit)], ["이익률", pct(d.profit / d.rev)], ["거래 건수", d.n + "건"]]);
    };
    const off = () => { bars.forEach(b => b.setAttribute("opacity", 1)); tip.hide(); };
    hit.addEventListener("mousemove", on); hit.addEventListener("focus", on);
    hit.addEventListener("mouseleave", off); hit.addEventListener("blur", off);
    svg.appendChild(hit);
  });
  box.prepend(svg);
}

// ---------- 화면 그리기 ----------
function renderChips() {
  const box = document.getElementById("chips");
  box.replaceChildren();
  for (const d of ["전체", ...DEPTS]) {
    const b = h("button", { class: "chip", type: "button", "aria-pressed": String(state.dept === d) }, d);
    b.addEventListener("click", () => { state.dept = d; renderAll(); });
    box.appendChild(b);
  }
}
function kpi(label, value, note) {
  const c = h("div", { class: "card kpi" });
  c.append(h("div", { class: "k-label" }, label), h("div", { class: "k-value" }, value), h("div", { class: "k-note" }, note));
  return c;
}
function strong(text) { return h("span", { class: "key-number" }, text); }
// 받침이 있으면 '이', 없으면 '가' (영문·숫자로 끝나면 받침 없음으로 처리)
function josa(word, withFinal, withoutFinal) {
  const c = word.charCodeAt(word.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return withoutFinal;
  return (c - 0xAC00) % 28 ? withFinal : withoutFinal;
}

function renderAll() {
  renderChips();
  const list = filtered();
  const t = total(list);
  const byMonth = MONTHS.map(ym => agg(list.filter(r => r.ym === ym), "ym")[0] || { key: ym, n: 0, rev: 0, cost: 0, profit: 0 });
  const scope = state.dept === "전체" ? "전체" : state.dept;
  const best = byMonth.reduce((a, b) => (b.rev > a.rev ? b : a));
  const worst = byMonth.reduce((a, b) => (b.rev < a.rev ? b : a));

  // 결론 한 줄
  const co = document.getElementById("callout");
  co.replaceChildren();
  const secondKey = state.dept === "전체" ? "dept" : "item";
  const second = agg(list, secondKey).sort((a, b) => b.rev - a.rev);
  const clients = agg(list, "client").sort((a, b) => b.rev - a.rev);
  co.append(
    `${scope} ${PERIOD} 매출액은 `, strong(eok(t.rev)), `, 이익률은 `, strong(pct(t.profit / t.rev)), `예요. `
  );
  if (byMonth.length > 1) co.append(
    `매출이 가장 컸던 달은 `, strong(`${monthLabel(best.key)}(${eok(best.rev)})`),
    `, 가장 작았던 달은 ${monthLabel(worst.key)}(${eok(worst.rev)})이에요. `
  );
  co.append(
    state.dept === "전체" ? `부서 중에서는 ` : `항목 중에서는 `,
    strong(second[0].key), josa(second[0].key, "이", "가") + " ", strong(eok(second[0].rev)), `으로 가장 많았어요.`
  );
  // 가장 최근 달과 그 전달 비교 — 늘었는지 줄었는지 글자로 함께 적는다
  if (byMonth.length > 1) {
    const last = byMonth[byMonth.length - 1], prev = byMonth[byMonth.length - 2];
    if (prev.rev > 0) {
      const ch = (last.rev - prev.rev) / prev.rev;
      co.append(` 가장 최근인 ${monthLabel(last.key)} 매출액은 `, strong(eok(last.rev)), `으로 전월보다 `,
        strong(`${Math.abs(ch * 100).toFixed(1)}% ${ch >= 0 ? "늘었어요" : "줄었어요"}`), `.`);
    }
  }

  // KPI
  const k = document.getElementById("kpis");
  k.replaceChildren(
    kpi("매출액", eok(t.rev), won(t.rev)),
    kpi("이익", eok(t.profit), won(t.profit)),
    kpi("이익률", pct(t.profit / t.rev), "이익 ÷ 매출액"),
    kpi("월평균 매출액", eok(t.rev / MONTHS.length), `거래 ${t.n}건 · ${MONTHS.length}개월`)
  );

  monthChart(document.getElementById("monthChart"), byMonth);

  document.getElementById("secondTitle").textContent = state.dept === "전체" ? "부서별 매출액" : `${state.dept} 항목별 매출액`;
  document.getElementById("secondSub").textContent = `${PERIOD} 합계, 큰 순서`;
  hbarChart(document.getElementById("secondChart"), second, state.dept === "전체" ? "부서" : "항목");

  document.getElementById("clientSub").textContent = `${PERIOD} 합계, 큰 순서 · 거래처 ${clients.length}곳 중 상위 ${Math.min(10, clients.length)}곳`;
  hbarChart(document.getElementById("clientChart"), clients.slice(0, 10), "거래처");

  // 표
  const tb = document.getElementById("monthTable");
  tb.replaceChildren();
  const thead = h("thead"), hr = h("tr");
  for (const c of ["월", "건수", "매출액(원)", "비용(원)", "이익(원)", "이익률"]) hr.appendChild(h("th", { scope: "col" }, c));
  thead.appendChild(hr); tb.appendChild(thead);
  const tbody = h("tbody");
  const line = (label, d, cls) => {
    const tr = h("tr", cls ? { class: cls } : {});
    for (const v of [label, d.n + "건", Math.round(d.rev).toLocaleString("ko-KR"), Math.round(d.cost).toLocaleString("ko-KR"),
      Math.round(d.profit).toLocaleString("ko-KR"), d.rev ? pct(d.profit / d.rev) : "-"]) tr.appendChild(h("td", {}, v));
    tbody.appendChild(tr);
  };
  byMonth.forEach(d => line(monthLabel(d.key), d));
  line("합계", t, "total");
  tb.appendChild(tbody);
  document.getElementById("tableSub").textContent = `${scope} 기준 · 차트의 숫자를 원 단위로 보여줘요.`;
}

renderAll();
let rt;
const hideTips = () => document.querySelectorAll(".tip").forEach(t => (t.style.display = "none"));
window.addEventListener("resize", () => { hideTips(); clearTimeout(rt); rt = setTimeout(renderAll, 120); });
window.addEventListener("scroll", hideTips, { passive: true });
</script>
</body>
</html>
